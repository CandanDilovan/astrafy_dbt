# Runs the dbt models on every pull request: when it is opened
# and whenever a new commit is pushed to it.
# Can also be started by hand (Actions tab > dbt run > Run workflow).
name: dbt run

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      # Authenticates as the dbt-runner service account created by Terraform.
      # Writes the key to a temp file and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which dbt picks up through Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Installs dbt-core and dbt-bigquery at the exact versions of uv.lock.
      - name: Install dbt and its dependencies
        run: uv sync --locked

      - name: Run dbt
        run: uv run dbt run --target ci
