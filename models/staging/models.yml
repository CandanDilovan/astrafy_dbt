version: 2

models:
  - name: stg_transactions
    description: >
      Bitcoin Cash transactions of the last 3 months of available data,
      reduced to the columns needed to compute address balances.
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_hash
        data_type: string
      - name: block_number
        data_type: int64
      - name: block_timestamp
        data_type: timestamp
      - name: is_coinbase
        data_type: bool
        description: True for the block reward transaction paid to the miner.
      - name: inputs
        data_type: array<struct<addresses array<string>, value numeric>>
        description: Spent outputs (addresses debited).
      - name: outputs
        data_type: array<struct<addresses array<string>, value numeric>>
        description: Created outputs (addresses credited).
